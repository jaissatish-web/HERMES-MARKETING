services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatehub
      POSTGRES_USER: gatehub
      POSTGRES_PASSWORD: change-me
    volumes:
      - gatehub_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatehub -d gatehub"]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://gatehub:change-me@postgres:5432/gatehub
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gatehub_pg:
